<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#140A1E">
<meta name="description" content="Sedici specchi deformanti dentro la fotocamera: foto, video con voce storta, giostra, rivelazione e cabina fototessera. Tutto resta nel telefono.">
<title>Specchio Storto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Specchio">
<link rel="preload" href="fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>
<div id="reticle"></div>
<div id="banner" aria-live="polite"></div>
<div id="count" aria-hidden="true"></div>
<div id="recInfo"><i></i><span id="recTime">0:00</span></div>
<div id="hint" role="status"></div>
<div id="flash"></div>
<div id="err" role="alert"></div>

<div id="top">
  <button class="glyph" id="albumBtn" data-i18n-label="album">🖼️</button>
  <div class="spacer"></div>
  <button class="glyph" id="colorBtn" data-i18n-label="colorBtn">🎨<span class="lbl" id="colorLbl"></span></button>
  <button class="glyph" id="voiceBtn" data-i18n-label="voiceBtn">🎤<span class="lbl" id="voiceLbl"></span></button>
  <button class="glyph" id="flip" data-i18n-label="flip">⟲</button>
</div>

<div id="hud">
  <div id="strip" role="group" data-i18n-label="effects"></div>
  <div id="row">
    <span class="ico" aria-hidden="true">◦</span>
    <input id="amount" type="range" min="0" max="100" value="60" data-i18n-label="amount">
    <span class="ico" aria-hidden="true">◉</span>
  </div>
  <div id="modes" role="group">
    <button class="mode" data-mode="foto" aria-pressed="true"></button>
    <button class="mode" data-mode="giostra" aria-pressed="false"></button>
    <button class="mode" data-mode="rivela" aria-pressed="false"></button>
    <button class="mode" data-mode="cabina" aria-pressed="false"></button>
  </div>
  <div id="shootRow">
    <button class="glyph" id="diceBtn" aria-label="?">🎲</button>
    <button id="shot" data-mode="foto" data-i18n-label="shot">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle id="ring" cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="0 100"/></svg>
    </button>
    <span style="width:44px"></span>
  </div>
</div>

<div id="sheet" class="panel" role="dialog" aria-modal="true">
  <div id="sheetMedia"></div>
  <div class="actions">
    <button class="btn primary" id="shareBtn"></button>
    <button class="btn" id="saveBtn"></button>
    <button class="btn ghost" id="delBtn"></button>
    <button class="btn ghost" id="closeBtn"></button>
  </div>
</div>

<div id="albumPanel" class="panel" role="dialog" aria-modal="true">
  <header><h2 data-i18n="album"></h2><button class="glyph" id="albumClose" aria-label="×">✕</button></header>
  <div id="grid"></div>
</div>

<div id="gate">
  <p class="kicker" data-i18n="kicker"></p>
  <h1 class="sign"><span class="a">Specchio</span><span class="b">Storto</span></h1>
  <p class="note" data-i18n-html="note"></p>
  <button class="cta" id="enter" data-i18n="enter"></button>
  <button id="daily"><small data-i18n="daily"></small><strong id="dailyName"></strong></button>
  <div class="stats"><span id="streak"></span><span id="found"></span></div>
  <p class="legal"><a href="privacy.html" data-i18n="privacy"></a> · v1.0</p>
</div>

<script>
  /* Se qualcosa va storto all'avvio lo mostro, invece di lasciare la schermata ferma. */
  window.addEventListener('error', e => {
    const el = document.getElementById('err');
    if(el){ el.textContent = 'Errore: ' + (e.message || e.error); el.classList.add('on'); }
  });
</script>
<script src="js/vendor/capacitor.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
